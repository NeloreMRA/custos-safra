<style>
  :root{
    --bg:#faf8f3; --panel:#ffffff; --ink:#2b2b23; --ink-soft:#6b6b5c; --line:#e4e0d4;
    --green:#4c6b3f; --green-dark:#38502e; --wheat:#c99a3d; --alert:#b3543f; --focus:#eef3e8;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Segoe UI',Arial,sans-serif; background:var(--bg); color:var(--ink); display:flex; min-height:100vh;}
  aside{width:230px; background:var(--green-dark); color:#f2efe4; flex-shrink:0; padding:22px 16px; display:flex; flex-direction:column; gap:4px;}
  aside h1{font-size:16px; margin:0 0 2px; font-weight:600;}
  aside p.sub{font-size:11px; color:#cdd8c4; margin:0 0 14px;}
  .safra-select{width:100%; margin-bottom:16px; padding:7px; border-radius:6px; border:1px solid #56714a; background:#3f5934; color:#fff; font-size:12px;}
  .navbtn{background:none; border:none; color:#e9e5d6; text-align:left; padding:9px 12px; border-radius:8px; cursor:pointer; font-size:13.5px; display:flex; gap:8px; align-items:center;}
  .navbtn:hover{background:rgba(255,255,255,.08);}
  .navbtn.active{background:var(--green); color:#fff; font-weight:600;}
  main{flex:1; padding:28px 36px; overflow-y:auto; max-width:100%;}
  h2{margin:0 0 4px; font-size:21px;}
  .caption{color:var(--ink-soft); font-size:13px; margin-bottom:18px;}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin-bottom:18px;}
  .grid{display:grid; gap:14px;}
  .grid.cols-2{grid-template-columns:1fr 1fr;}
  .grid.cols-3{grid-template-columns:1fr 1fr 1fr;}
  label{font-size:11.5px; color:var(--ink-soft); display:block; margin-bottom:3px;}
  input, select{width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:6px; font-size:13.5px; background:#fdfcf9;}
  button.primary{background:var(--green); color:#fff; border:none; padding:8px 16px; border-radius:6px; font-size:13px; cursor:pointer;}
  button.primary:hover{background:var(--green-dark);}
  button.secondary{background:#fff; color:var(--green-dark); border:1px solid var(--green); padding:7px 14px; border-radius:6px; font-size:12.5px; cursor:pointer;}
  button.secondary:hover{background:var(--focus);}
  button.ghost{background:none; border:1px solid var(--line); padding:4px 9px; border-radius:6px; cursor:pointer; font-size:11.5px; color:var(--alert);}
  .toolbar{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
  .table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:8px;}
  table{width:100%; border-collapse:collapse; font-size:12.5px; min-width:1300px;}
  th, td{text-align:left; padding:0; border-bottom:1px solid var(--line); border-right:1px solid #f0eee4;}
  thead th{background:#f5f3ea; color:var(--ink); font-weight:600; font-size:11.5px; padding:0; white-space:nowrap; position:relative;}
  .th-flex{display:flex; align-items:center; justify-content:space-between; gap:6px; padding:8px 6px 8px 10px;}
  .th-filter-btn{background:none; border:none; cursor:pointer; font-size:11px; color:var(--ink-soft); padding:2px 5px; border-radius:4px;}
  .th-filter-btn:hover{background:#e9e5d6;}
  .th-filter-btn.active{color:var(--green-dark); font-weight:700;}
  tbody td input, tbody td select{border:none; background:transparent; padding:7px 9px; font-size:12.5px; border-radius:0; width:100%; min-width:95px;}
  tbody td select{min-width:120px;}
  tbody td input:focus, tbody td select:focus{background:var(--focus); outline:1px solid var(--green);}
  tbody td.readonly{padding:7px 9px; color:var(--ink-soft); background:#fbfaf6; white-space:nowrap;}
  .cell-unit{display:flex; align-items:center;}
  .cell-unit input{flex:1;}
  .cell-unit span{padding-right:8px; color:var(--ink-soft); font-size:11.5px;}
  tbody tr:hover{background:#fbfaf6;}
  .metrics{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:18px;}
  .metrics.cols-4{grid-template-columns:repeat(4,1fr);}
  @media (max-width:900px){ .metrics.cols-4{grid-template-columns:repeat(2,1fr);} }
  .text-red{color:var(--alert) !important; font-weight:700;}
  .metric{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px;}
  .metric .val{font-size:19px; font-weight:700; color:var(--green-dark);}
  .metric .lbl{font-size:11px; color:var(--ink-soft); margin-top:2px;}
  .empty{color:var(--ink-soft); font-size:13px; font-style:italic; padding:10px 0;}
  .section-title{font-size:14.5px; font-weight:600; margin:0 0 10px;}
  .badge{display:inline-block; background:var(--wheat); color:#fff; font-size:10.5px; padding:2px 8px; border-radius:20px; margin-left:6px;}
  .safra-card{border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;}
  .safra-card.active{border-color:var(--green); background:var(--focus);}
  .safra-card h3{margin:0 0 3px; font-size:15px;}
  .safra-card p{margin:0; font-size:12px; color:var(--ink-soft);}
  .sync-status{font-size:11px; padding:6px 8px; border-radius:6px; margin-bottom:14px; display:flex; align-items:center; gap:6px;}
  .sync-status.ok{background:rgba(76,107,63,.25); color:#d7e8cd;}
  .sync-status.local{background:rgba(201,154,61,.25); color:#f0d9a8;}
  .sync-status.err{background:rgba(179,84,63,.3); color:#f3c9c1;}
  /* Filtro estilo Excel */
  .filter-panel{position:fixed; z-index:2000; background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.14); width:230px; max-width:calc(100vw - 16px); padding:10px; font-weight:normal;}
  .fp-sort-row{display:flex; gap:6px; margin-bottom:8px;}
  .fp-btn{flex:1; background:#f5f3ea; border:1px solid var(--line); border-radius:6px; padding:5px; font-size:11px; cursor:pointer;}
  .fp-btn:hover{background:#ebe8dc;}
  .fp-search{width:100%; margin-bottom:6px; font-size:12px; padding:5px 7px;}
  .fp-list{max-height:160px; overflow-y:auto; border:1px solid var(--line); border-radius:6px; padding:4px 6px; margin-bottom:8px;}
  .fp-item{display:block; font-size:12px; padding:3px 0; cursor:pointer;}
  .fp-item input{width:auto; margin-right:6px;}
  .fp-actions{display:flex; gap:6px; justify-content:flex-end;}
  @page{ size: A4 landscape; margin: 10mm; }
  @media print{
    aside, .no-print, .filter-panel{display:none !important;}
    main{padding:0;}
    .panel{border:none; padding:0; margin-bottom:12px;}
    .table-wrap{border:none; overflow:visible !important;}
    table{font-size:9px; min-width:0; width:100%; table-layout:auto;}
    tbody td input, tbody td select{border:none !important; background:transparent !important; padding:2px 3px !important; -webkit-appearance:none;}
    tr{page-break-inside:avoid;}
    body{background:#fff;}
  }

  /* LOGIN FIREBASE */
  body.auth-pending aside, body.auth-pending main,
  body.auth-logged-out aside, body.auth-logged-out main{display:none!important;}
  #loginScreen{display:none; min-height:100vh; width:100%; place-items:center; padding:20px; background:var(--bg);}
  body.auth-pending #loginScreen, body.auth-logged-out #loginScreen{display:grid;}
  body.authenticated #loginScreen{display:none;}
  .login-card{width:min(390px,100%); background:#fff; border:1px solid var(--line); border-radius:12px; padding:26px; box-shadow:0 10px 30px rgba(0,0,0,.08);}
  .login-card h2{margin:0 0 5px; font-size:22px;}
  .login-card>p{margin:0 0 20px; color:var(--ink-soft); font-size:13px;}
  .login-field{margin-bottom:12px;}
  .login-field label{font-size:12px; font-weight:600;}
  .login-field input{padding:10px 11px; background:#fff;}
  .login-submit{width:100%; border:0; border-radius:6px; padding:10px 14px; background:var(--green); color:#fff; cursor:pointer; font-weight:700;}
  .login-submit:disabled{opacity:.65; cursor:wait;}
  .login-error{min-height:18px; margin-top:10px; text-align:center; color:var(--alert); font-size:12px;}
  .side-tool{width:100%; margin-bottom:7px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.18); color:#f2efe4; padding:7px 10px; border-radius:6px; cursor:pointer; text-align:left; font-size:12px;}
  .side-tool:hover{background:rgba(255,255,255,.12);}
  .side-tool:disabled{opacity:.45; cursor:not-allowed;}
  .logout-btn{margin-top:auto;}
</style>
</head>

<div id="loginScreen">

    <button id="loginButton" class="login-submit" type="submit">Entrar</button>
    <div id="loginError" class="login-error" aria-live="polite"></div>
  </form>
</div>

</aside>

// =================== VARIEDADES POR TALHÃO ===================
function variedadesDoTalhao(safra, talhao){
  const t = (safra.talhoes || []).find(x=>x.talhao===talhao);
  if(!t) return [];
  return [t.variedade, t.variedade2].map(v=>String(v||'').trim()).filter((v,i,a)=>v && a.indexOf(v)===i);
}

function normalizarEstruturaSafras(safras){
  Object.entries(safras || {}).forEach(([chave,s])=>{
    s.talhoes = Array.isArray(s.talhoes) ? s.talhoes : [];
    s.colheita = Array.isArray(s.colheita) ? s.colheita : [];
    s.talhoes.forEach(t=>{
      if(t.variedade===undefined || t.variedade===null) t.variedade='';
      if(t.variedade2===undefined || t.variedade2===null) t.variedade2='';
    });
    // Preenche automaticamente a variedade faltante em QUALQUER cultura
    // usando a primeira variedade cadastrada no respectivo talhão.
    s.colheita.forEach(c=>{
      const vars = variedadesDoTalhao(s, c.talhao);
      const atual = String(c.variedade||'').trim();
      if(!atual && vars.length) c.variedade = vars[0];
      // Se o valor antigo não pertence mais ao talhão, mantém enquanto não houver opções;
      // havendo opções válidas, corrige para a primeira.
      else if(atual && vars.length && !vars.includes(atual)) c.variedade = vars[0];
    });
  });
  return safras;
}

const UNDO_LIMIT = 50;
let undoStack = [];
function cloneStateForUndo(){ return JSON.parse(JSON.stringify(state)); }
function updateUndoButton(){
  const b = document.getElementById('undoBtn');
  if(b) b.disabled = undoStack.length===0;
}
function recordUndo(){
  undoStack.push(cloneStateForUndo());
  if(undoStack.length>UNDO_LIMIT) undoStack.shift();
  updateUndoButton();
}
function clearUndoHistory(){ undoStack = []; updateUndoButton(); }
function undoLastChange(){
  if(!undoStack.length) return;
  clearTimeout(saveTimer);
  const previous = undoStack.pop();
  state = previous;
  normalizarEstruturaSafras(state.safras);
  render();
  updateUndoButton();
  scheduleSave(true);
}

function setSyncStatus(text, cls){
  const el = document.getElementById('sync-status');
  if(el){ el.textContent = text; el.className = 'sync-status no-print ' + cls; }
}

function initFirebase(){
  try{
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    docRef = db.collection('custos-safra').doc('estado-atual');
    setSyncStatus('🟡 Conectando...', 'local');

    docRef.get().then(snap=>{
      if(snap.exists && snap.data().safras){
        suppressSave = true;
        state.safras = normalizarEstruturaSafras(snap.data().safras);
        clearUndoHistory();
        let adicionouSojaImportada = false;
        if(!state.safras.soja2526){
          state.safras.soja2526 = criarSafraSoja2526Importada();
          adicionouSojaImportada = true;
        }
        if(!state.safras[state.safraAtual]) state.safraAtual = Object.keys(state.safras)[0];
        render();
        suppressSave = false;
        if(adicionouSojaImportada){
          docRef.set({safras: JSON.parse(JSON.stringify(state.safras))});
        }
      } else {
        // primeira vez: manda os dados iniciais (milho) pro banco
        docRef.set({safras: JSON.parse(JSON.stringify(state.safras))});
      }
      firebaseReady = true;
      setSyncStatus('🟢 Sincronizado', 'ok');

      if(unsubscribeSnapshot) unsubscribeSnapshot();
      unsubscribeSnapshot = docRef.onSnapshot(snap=>{
        if(!snap.exists) return;
        const remote = snap.data().safras;
        if(!remote) return;
        if(JSON.stringify(remote) === JSON.stringify(state.safras)) return; // eco da própria escrita
        suppressSave = true;
        state.safras = normalizarEstruturaSafras(remote);
        clearUndoHistory();
        if(!state.safras[state.safraAtual]) state.safraAtual = Object.keys(state.safras)[0];
        render();
        suppressSave = false;
        setSyncStatus('🟢 Sincronizado', 'ok');
      }, err=>{ console.error(err); setSyncStatus('🔴 Sem conexão', 'err'); });
    }).catch(err=>{ console.error(err); setSyncStatus('🔴 Erro ao conectar', 'err'); });
  }catch(err){
    console.error(err);
    setSyncStatus('🔴 Erro na configuração', 'err');
  }
}
function scheduleSave(immediate=false){
  if(!firebaseReady || suppressSave || !docRef) return;
  setSyncStatus('🟡 Salvando...', 'local');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    docRef.set({safras: JSON.parse(JSON.stringify(state.safras))})
      .then(()=> setSyncStatus('🟢 Sincronizado', 'ok'))
      .catch(err=>{ console.error(err); setSyncStatus('🔴 Erro ao salvar', 'err'); });
  }, immediate ? 0 : 600);
}

  sel.innerHTML = Object.keys(state.safras).map(k=>`<option value="${k}" ${k===state.safraAtual?'selected':''}>${esc(state.safras[k].nome)}</option>`).join('');
}
document.getElementById('safra-selector').addEventListener('change', e=>{ state.safraAtual = e.target.value; localStorage.setItem('safraAtual',state.safraAtual); render(); });

function render(){
  closeFilterMenu();
  refreshSafraSelector();
  const main = document.getElementById('main');
  if(currentPage==="dashboard") main.innerHTML = pageDashboard();
  else if(currentPage==="colheita") main.innerHTML = pageColheita();
  else if(currentPage==="adiantamentos") main.innerHTML = pageAdiantamentos();
  else if(currentPage==="vendas") main.innerHTML = pageVendas();
  else if(currentPage==="cadastros") main.innerHTML = pageCadastros();
  else if(currentPage==="safras") main.innerHTML = pageSafras();
  bindStaticEvents();
  scheduleSave();
}

// =================== DERIVED ===================
function colheitaDerived(r){
  const sacasBrutas = (r.pesoBruto||0)/60;
  const totalFrete = sacasBrutas*(r.vlSaca||0);
  const sacasLiquidas = (r.saldoLiquido||0)/60;
  const pctDesconto = r.pesoBruto ? (r.pesoBruto-r.saldoLiquido)/r.pesoBruto : 0;
  return {sacasBrutas, totalFrete, sacasLiquidas, pctDesconto};
}
function vendaDerived(r){
  const sacasVendidas = (r.pesoVendido||0)/60;
  const totalVenda = sacasVendidas*(r.vlSaca||0);
  return {sacasVendidas, totalVenda};
}


function dashboardRows(tableKey, rows, columns){
  tableState[tableKey] = tableState[tableKey] || {colFilters:{}, sortKey:null, sortDir:1};
  const cfg = {tableKey, rows, columns, computeDerived:r=>r};
  tableRegistry[tableKey] = cfg;
  return computeVisibleRows(cfg);
}
function dashboardTh(tableKey, key, label, extraStyle=''){
  const ts = tableState[tableKey] || {colFilters:{}, sortKey:null, sortDir:1};
  const active = ts.colFilters[key] || ts.sortKey===key;
  const arrow = ts.sortKey===key ? (ts.sortDir>0?' ▲':' ▼') : '';
  return `<th style="padding:0;${extraStyle}"><div class="th-flex"><span>${label}${arrow}</span><button class="th-filter-btn ${active?'active':''}" onclick="toggleFilterMenu('${tableKey}','${key}', this)">▾</button></div></th>`;
}

function pageDashboard(){

  const pesoBruto = s.colheita.reduce((sum,c)=>sum+Number(c.pesoBruto||0),0);
  const pesoLiquido = s.colheita.reduce((sum,c)=>sum+Number(c.saldoLiquido||0),0);
  const sacasLiq = s.colheita.reduce((sum,c)=>sum+colheitaDerived(c).sacasLiquidas,0);
  const scHa = areaTotal ? sacasLiq/areaTotal : 0;
  const pctDescontoMedio = pesoBruto ? (pesoBruto-pesoLiquido)/pesoBruto : 0;
  const umidadeMedia = s.colheita.length ? s.colheita.reduce((sum,c)=>sum+Number(c.umidade||0),0)/s.colheita.length : 0;
  const sacasPerdidas = (pesoBruto-pesoLiquido)/60;
  const vendidoTotal = s.vendas.reduce((sum,v)=>sum+vendaDerived(v).sacasVendidas,0);
  const saldoVender = sacasLiq - vendidoTotal;
  const pctJaVendido = sacasLiq ? vendidoTotal/sacasLiq : 0;
  const faturamento = s.vendas.reduce((sum,v)=>sum+vendaDerived(v).totalVenda,0);
  const precoMedio = vendidoTotal ? faturamento/vendidoTotal : 0;

  const porTalhao = {};
  s.colheita.forEach(c=>{
    if(!porTalhao[c.talhao]) porTalhao[c.talhao]={sacas:0, cargas:0, pesoBruto:0, pesoLiquido:0, umidadeSum:0};
    const d = colheitaDerived(c);
    porTalhao[c.talhao].sacas += d.sacasLiquidas;
    porTalhao[c.talhao].cargas += 1;
    porTalhao[c.talhao].pesoBruto += Number(c.pesoBruto||0);
    porTalhao[c.talhao].pesoLiquido += Number(c.saldoLiquido||0);
    porTalhao[c.talhao].umidadeSum += Number(c.umidade||0);
  });
  const talhaoRows = Object.keys(porTalhao).map(t=>{
    const areaT = (s.talhoes.find(x=>x.talhao===t)||{}).area || 0;
    const p = porTalhao[t];
    return {
      talhao:t, area:areaT, cargas:p.cargas, sacas:p.sacas, scha: areaT? p.sacas/areaT : 0,
      sacasPerdidas: (p.pesoBruto-p.pesoLiquido)/60, umidadeMed: p.cargas? p.umidadeSum/p.cargas : 0,
    };
  });
  const talhaoVisibleRows = dashboardRows('dash-talhao', talhaoRows, [
    {key:'talhao',label:'Talhão',type:'text'},{key:'area',label:'Área (ha)',type:'number'},{key:'cargas',label:'Cargas',type:'number'},
    {key:'sacas',label:'Sacas líq.',type:'number'},{key:'scha',label:'Sc/ha',type:'number'},{key:'sacasPerdidas',label:'Sacas perdidas',type:'number'},{key:'umidadeMed',label:'Umidade méd.',type:'pct'}
  ]);
  const talhaoTotais = talhaoVisibleRows.reduce((acc,r)=>({

    sacasPerdidas:acc.sacasPerdidas+Number(r.sacasPerdidas||0), umidadePeso:acc.umidadePeso+Number(r.umidadeMed||0)*Number(r.cargas||0)
  }),{area:0,cargas:0,sacas:0,sacasPerdidas:0,umidadePeso:0});
  const talhaoScHa = talhaoTotais.area ? talhaoTotais.sacas/talhaoTotais.area : 0;
  const talhaoUmidadeMedia = talhaoTotais.cargas ? talhaoTotais.umidadePeso/talhaoTotais.cargas : 0;
  const maxTalhaoScHa = Math.max(1, ...talhaoVisibleRows.map(r=>Number(r.scha||0)));

  const porVariedade = {};

// =================== FILTRO ESTILO EXCEL ===================
function displayValueForFilter(cfg, row, key){
  const col = cfg.columns.find(c=>c.key===key);
  let v = col.derived ? cfg.computeDerived(row)[key] : row[key];
  if(col.type==='pct') v = fmtPct(v);
  else if(col.type==='money') v = fmtR(v);
  else if(col.type==='pctinput') v = fmtPct(v);
  else if(col.type==='date') v = v || '';
  else if(v===undefined||v===null||v==='') v = '(vazio)';
  return String(v);
}
function getFilteredRows(cfg, excludeKey){
  let rows = cfg.rows.slice();
  const ts = tableState[cfg.tableKey];
  Object.entries(ts.colFilters||{}).forEach(([key,set])=>{
    if(key===excludeKey || !set) return;
    rows = rows.filter(r=> set.has(displayValueForFilter(cfg,r,key)));
  });
  return rows;
}
function computeVisibleRows(cfg){
  const ts = tableState[cfg.tableKey];
  let rows = getFilteredRows(cfg, null);
  if(ts.sortKey){
    const col = cfg.columns.find(c=>c.key===ts.sortKey);
    rows.sort((a,b)=>{
      let va = col.derived ? cfg.computeDerived(a)[ts.sortKey] : a[ts.sortKey];
      let vb = col.derived ? cfg.computeDerived(b)[ts.sortKey] : b[ts.sortKey];
      if(typeof va === 'string' || typeof vb === 'string') return String(va||'').localeCompare(String(vb||''),'pt')*ts.sortDir;
      return ((va||0)-(vb||0))*ts.sortDir;
    });
  }
  return rows;
}
function closeFilterMenu(){
  if(openFilterPanel){
    openFilterPanel.panel.remove();
    document.removeEventListener('click', outsideFilterClick, {capture:true});
    openFilterPanel = null;
  }
}
function outsideFilterClick(e){
  if(openFilterPanel && !openFilterPanel.panel.contains(e.target) && !e.target.classList.contains('th-filter-btn')){
    closeFilterMenu();
  }
}
function toggleFilterMenu(tableKey, colKey, btnEl){
  if(openFilterPanel && openFilterPanel.tableKey===tableKey && openFilterPanel.colKey===colKey){ closeFilterMenu(); return; }
  closeFilterMenu();
  const cfg = tableRegistry[tableKey];
  const ts = tableState[tableKey];
  const rows = getFilteredRows(cfg, colKey);
  const uniqueVals = Array.from(new Set(rows.map(r=>displayValueForFilter(cfg,r,colKey)))).sort((a,b)=>String(a).localeCompare(String(b),'pt',{numeric:true}));
  const activeSet = ts.colFilters[colKey];
  const panel = document.createElement('div');
  panel.className='filter-panel';
  panel.addEventListener('click', e=>e.stopPropagation());
  panel.innerHTML = `
    <div class="fp-sort-row">
      <button class="fp-btn" data-act="sort-asc">A→Z ▲</button>
      <button class="fp-btn" data-act="sort-desc">Z→A ▼</button>
    </div>
    <input type="text" class="fp-search" placeholder="Buscar...">
    <label class="fp-item fp-all"><input type="checkbox" class="fp-all-cb" ${!activeSet?'checked':''}> Selecionar tudo</label>
    <div class="fp-list">
      ${uniqueVals.map(v=>`<label class="fp-item"><input type="checkbox" class="fp-item-cb" value="${esc(v)}" ${(!activeSet || activeSet.has(v))?'checked':''}> ${esc(v)}</label>`).join('')}
    </div>
    <div class="fp-actions">
      <button class="ghost" data-act="clear">Limpar filtro</button>
      <button class="secondary" data-act="apply">OK</button>
    </div>
  `;
  document.body.appendChild(panel);
  const rect = btnEl.getBoundingClientRect();
  const panelWidth = Math.min(230, window.innerWidth - 16);
  panel.style.width = panelWidth + 'px';
  let left = rect.right - panelWidth;
  left = Math.max(8, Math.min(left, window.innerWidth - panelWidth - 8));
  let top = rect.bottom + 6;
  panel.style.left = left + 'px';
  panel.style.top = top + 'px';
  // Se não couber abaixo, abre acima do cabeçalho.
  requestAnimationFrame(()=>{
    const ph = panel.offsetHeight;
    if(top + ph > window.innerHeight - 8){
      top = Math.max(8, rect.top - ph - 6);
      panel.style.top = top + 'px';
    }
  });
  openFilterPanel = {tableKey,colKey,panel};

  panel.querySelector('[data-act="sort-asc"]').addEventListener('click', ()=>{ ts.sortKey=colKey; ts.sortDir=1; render(); });
  panel.querySelector('[data-act="sort-desc"]').addEventListener('click', ()=>{ ts.sortKey=colKey; ts.sortDir=-1; render(); });
  panel.querySelector('.fp-search').addEventListener('input', e=>{
    const q = e.target.value.toLowerCase();
    panel.querySelectorAll('.fp-item:not(.fp-all)').forEach(lab=>{
      lab.style.display = lab.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });
  panel.querySelector('.fp-all-cb').addEventListener('change', e=>{
    panel.querySelectorAll('.fp-item-cb').forEach(cb=>cb.checked = e.target.checked);
  });
  panel.querySelector('[data-act="clear"]').addEventListener('click', ()=>{
    ts.colFilters[colKey] = null;
    render();
  });
  panel.querySelector('[data-act="apply"]').addEventListener('click', ()=>{
    const checked = Array.from(panel.querySelectorAll('.fp-item-cb:checked')).map(cb=>cb.value);
    if(checked.length===uniqueVals.length){ ts.colFilters[colKey] = null; }
    else { ts.colFilters[colKey] = new Set(checked); }
    render();
  });
  setTimeout(()=>document.addEventListener('click', outsideFilterClick, {capture:true}), 0);
}

// =================== TABELA GENÉRICA (excel-like) ===================
function renderTablePage(cfg){
  tableState[cfg.tableKey] = tableState[cfg.tableKey] || {colFilters:{}, sortKey:null, sortDir:1};
  tableRegistry[cfg.tableKey] = cfg;
  const ts = tableState[cfg.tableKey];

  const theadCols = cfg.columns.map(c=>{
    const active = ts.colFilters[c.key] || ts.sortKey===c.key;
    const arrow = ts.sortKey===c.key ? (ts.sortDir>0?' ▲':' ▼') : '';
    return `<th><div class="th-flex"><span>${c.label}${arrow}</span><button class="th-filter-btn ${active?'active':''}" onclick="toggleFilterMenu('${cfg.tableKey}','${c.key}', this)">▾</button></div></th>`;
  }).join('') + '<th class="no-print"></th>';

  return `
    <h2>${cfg.title}</h2>
    <div class="caption">${cfg.caption}</div>
    ${cfg.formHtml || ''}
    <div class="toolbar no-print">
      <button class="secondary" onclick="addTableRow('${cfg.tableKey}')">+ Nova linha em branco</button>
      <button class="secondary" onclick="exportTable('${cfg.tableKey}')">⬇️ Exportar Excel</button>
      <button class="secondary" onclick="window.print()">🖨️ Imprimir</button>
    </div>
    ${cfg.metricsHtml || ''}
    <div class="panel" style="padding:0;">
      <div class="table-wrap">
        <table id="tbl-${cfg.tableKey}">
          <thead><tr>${theadCols}</tr></thead>
          <tbody id="tbody-${cfg.tableKey}"></tbody>
        </table>
      </div>
    </div>
  `;
}

function tableCellHtml(cfg, row, idx, col){
  if(col.derived){
    const d = cfg.computeDerived(row);
    const v = d[col.key];
    let display;
    if(col.type==='pct') display = fmtPct(v);
    else if(col.type==='money') display = fmtR(v);
    else if(col.type==='text') display = esc(v);
    else display = fmt(v) + (col.unit ? ' '+col.unit : '');
    return `<td class="readonly">${display}</td>`;
  }
  if(col.type==='select'){
    const optsList = col.optionsFn ? col.optionsFn(row) : [];
    const opts = optsList.map(o=>`<option value="${esc(o)}" ${row[col.key]===o?'selected':''}>${esc(o)}</option>`).join('');
    return `<td><select data-idx="${idx}" data-field="${col.key}" data-table="${cfg.tableKey}" onchange="onCellEdit(this,'${cfg.tableKey}')"><option value="">—</option>${opts}</select></td>`;
  }
  if(col.type==='date'){
    return `<td><input type="date" data-idx="${idx}" data-field="${col.key}" data-table="${cfg.tableKey}" value="${esc(row[col.key])}" oninput="onCellEdit(this,'${cfg.tableKey}')"></td>`;
  }
  if(col.type==='pctinput'){
    const v = fractionToPercentDisplay(row[col.key]);
    return `<td><div class="cell-unit"><input type="number" step="0.1" data-idx="${idx}" data-field="${col.key}" data-table="${cfg.tableKey}" data-pct="1" value="${v}" oninput="onCellEdit(this,'${cfg.tableKey}')"><span>%</span></div></td>`;
  }
  if(col.type==='number'){
  const unit = col.unit ? `<span>${col.unit}</span>` : '';
  if(col.brInteger){
    const v = row[col.key]==='' || row[col.key]===undefined ? '' : Number(row[col.key]).toLocaleString('pt-BR',{maximumFractionDigits:0});
    return `<td><div class="cell-unit"><input type="text" inputmode="numeric" data-br-int="1" data-idx="${idx}" data-field="${col.key}" data-table="${cfg.tableKey}" value="${v}" oninput="onCellEdit(this,'${cfg.tableKey}')">${unit}</div></td>`;
  }
  return `<td><div class="cell-unit"><input type="number" step="any" data-idx="${idx}" data-field="${col.key}" data-table="${cfg.tableKey}" value="${row[col.key]===undefined?'':row[col.key]}" oninput="onCellEdit(this,'${cfg.tableKey}')">${unit}</div></td>`;
}
  if(col.type==='checkbox'){
    return `<td style="text-align:center; padding:7px 9px;"><input type="checkbox" style="width:auto;" data-idx="${idx}" data-field="${col.key}" data-table="${cfg.tableKey}" ${row[col.key]?'checked':''} onchange="onCellEditCheckbox(this,'${cfg.tableKey}')"></td>`;
  }
  return `<td><input type="text" data-idx="${idx}" data-field="${col.key}" data-table="${cfg.tableKey}" value="${esc(row[col.key])}" oninput="onCellEdit(this,'${cfg.tableKey}')"></td>`;
}
function onCellEditCheckbox(el, tableKey){
  recordUndo();
  const idx = Number(el.dataset.idx);
  const field = el.dataset.field;
  const row = tableRowsVisible[tableKey][idx];
  row[field] = el.checked;
  scheduleSave();
}

let tableRowsVisible = {};

function renderTbody(tableKey){
  const cfg = tableRegistry[tableKey];
  const rows = computeVisibleRows(cfg);
  tableRowsVisible[tableKey] = rows;
  const tbody = document.getElementById('tbody-'+tableKey);
  if(!tbody) return;
  if(!rows.length){
    tbody.innerHTML = `<tr><td colspan="${cfg.columns.length+1}" class="empty">Nenhum registro encontrado (verifique os filtros) ou lance um novo registro acima.</td></tr>`;
    return;
  }
  tbody.innerHTML = rows.map((row,idx)=>{
    const cells = cfg.columns.map(col=>tableCellHtml(cfg, row, idx, col)).join('');
    return `<tr data-row-idx="${idx}">${cells}<td class="no-print"><button class="ghost" onclick="deleteTableRow('${tableKey}', ${idx})">✕</button></td></tr>`;
  }).join('');
}

function refreshDependentSelects(cfg, row, tr, changedField){
  cfg.columns.forEach((col,ci)=>{
    if(col.type!=='select' || col.dependsOn!==changedField) return;
    const select = tr.children[ci] && tr.children[ci].querySelector('select');
    if(!select) return;
    const options = col.optionsFn ? col.optionsFn(row) : [];
    let chosen = String(row[col.key]||'');
    if(!options.includes(chosen)) chosen = options[0] || '';
    row[col.key] = chosen;
    select.innerHTML = `<option value="">—</option>` + options.map(o=>`<option value="${esc(o)}" ${o===chosen?'selected':''}>${esc(o)}</option>`).join('');
  });
}

function onCellEdit(el, tableKey){
  recordUndo();
  const idx = Number(el.dataset.idx);
  const field = el.dataset.field;
  const row = tableRowsVisible[tableKey][idx];
  let val = el.value;

if(el.dataset.brInt){
  const numeros = String(val).replace(/\D/g,'');
  val = numeros==='' ? '' : Number(numeros);
  el.value = numeros==='' ? '' : Number(numeros).toLocaleString('pt-BR');
}
else if(el.tagName==='INPUT' && el.type==='number'){
  val = val==='' ? '' : Number(val);
  if(el.dataset.pct) val = pctToFraction(val);
}
  row[field] = val;
  const tr = el.closest('tr');
  const cfg = tableRegistry[tableKey];
  refreshDependentSelects(cfg, row, tr, field);
  // autofill de campo dependente (ex: variedade sugerida a partir do talhão), só se o campo alvo estiver vazio
  const editedCol = cfg.columns.find(c=>c.key===field);
  if(editedCol && editedCol.autofillTarget && !row[editedCol.autofillTarget]){
    const targetIdx = cfg.columns.findIndex(c=>c.key===editedCol.autofillTarget);
    const newVal = editedCol.autofillFn(val);
    if(newVal && targetIdx>-1){
      row[editedCol.autofillTarget] = newVal;
      const targetInput = tr.children[targetIdx].querySelector('input,select');
      if(targetInput) targetInput.value = newVal;
    }
  }
  cfg.columns.forEach((col,ci)=>{
    if(col.derived){
      const d = cfg.computeDerived(row);
      const v = d[col.key];
      let display;
      if(col.type==='pct') display = fmtPct(v);
      else if(col.type==='money') display = fmtR(v);
      else if(col.type==='text') display = esc(v);
      else display = fmt(v) + (col.unit ? ' '+col.unit : '');
      tr.children[ci].textContent = display;
    }
  });  scheduleSave();
}
function addTableRow(tableKey){
  recordUndo();
  const cfg = tableRegistry[tableKey];
  cfg.rows.push(cfg.newRow());
  render();
}
function deleteTableRow(tableKey, idx){
  recordUndo();
  const cfg = tableRegistry[tableKey];
  const row = tableRowsVisible[tableKey][idx];
  const realIdx = cfg.rows.indexOf(row);
  if(realIdx>-1) cfg.rows.splice(realIdx,1);
  render();
}

// =================== FORMULÁRIO DE INSERÇÃO (acima da tabela) ===================
function renderAddForm(cfg){
  const editableCols = cfg.columns.filter(c=>!c.derived);
  const fields = editableCols.map(c=>{
    if(c.type==='select'){
      const optsList = c.optionsFn ? c.optionsFn(null) : [];
      const opts = optsList.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('');
      return `<div><label>${c.label}</label><select name="${c.key}"><option value="">—</option>${opts}</select></div>`;
    }
    if(c.type==='date') return `<div><label>${c.label}</label><input type="date" name="${c.key}"></div>`;
    if(c.type==='pctinput') return `<div><label>${c.label} (%)</label><input type="number" step="0.1" name="${c.key}" placeholder="Ex: 15,9"></div>`;
    if(c.type==='number') return `<div><label>${c.label}${c.unit?` (${c.unit})`:''}</label><input type="number" step="any" name="${c.key}"></div>`;
    if(c.type==='checkbox') return `<div style="display:flex; align-items:flex-end; padding-bottom:8px;"><label style="display:flex; align-items:center; gap:6px; margin:0;"><input type="checkbox" name="${c.key}" style="width:auto;"> ${c.label}</label></div>`;
    return `<div><label>${c.label}</label><input type="text" name="${c.key}"></div>`;
  }).join('');
  return `
    <div class="panel">
      <p class="section-title">Adicionar registro</p>
      <div class="grid cols-3" id="addform-${cfg.tableKey}">${fields}</div>
      <button class="primary" style="margin-top:14px;" onclick="submitAddForm('${cfg.tableKey}')" type="button">Adicionar</button>
    </div>
  `;
}
function submitAddForm(tableKey){
  recordUndo();
  const cfg = tableRegistry[tableKey];
  const wrap = document.getElementById('addform-'+tableKey);
  const row = {};
  cfg.columns.filter(c=>!c.derived).forEach(c=>{
    const el = wrap.querySelector(`[name="${c.key}"]`);
    let v = c.type==='checkbox' ? (el ? el.checked : false) : (el ? el.value : '');
    if(c.type==='number') v = v===''?0:Number(v);
    if(c.type==='pctinput') v = pctToFraction(v);
    row[c.key] = v;
  });
  cfg.rows.push(row);
  render();
}

// =================== EXPORTAR EXCEL (estilizado, via ExcelJS) ===================
function styleSheet(ws, columns){
  const header = ws.getRow(1);
  header.eachCell(cell=>{
    cell.font = {bold:true, color:{argb:'FFFFFFFF'}};
    cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FF4C6B3F'}};
    cell.alignment = {vertical:'middle', horizontal:'center', wrapText:true};
    cell.border = {bottom:{style:'thin'}, top:{style:'thin'}, left:{style:'thin'}, right:{style:'thin'}};
  });
  header.height = 26;
  columns.forEach((c,i)=>{
    const col = ws.getColumn(i+1);
    col.width = Math.max(14, c.label.length+4);
    if(c.type==='money') col.numFmt = '"R$" #,##0.00';
    else if(c.type==='pct' || c.type==='pctinput') col.numFmt = '0.0%';
    else if(c.type==='number' || c.derived) col.numFmt = '#,##0.00';
    col.alignment = {vertical:'middle'};
  });
  ws.views = [{state:'frozen', ySplit:1}];
  const lastCol = String.fromCharCode(64 + Math.min(26,columns.length));
  ws.autoFilter = `A1:${lastCol}1`;
  ws.eachRow((row, rn)=>{ if(rn>1) row.eachCell(cell=>{ cell.border = {bottom:{style:'hair', color:{argb:'FFE4E0D4'}}}; }); });
}
async function addSheetForTable(workbook, sheetName, columns, rows, computeDerived){
  const ws = workbook.addWorksheet(sheetName.slice(0,31));
  ws.columns = columns.map(c=>({header:c.label, key:c.key}));
  rows.forEach(r=>{
    const rowData = {};
    columns.forEach(c=>{
      let v = c.derived ? computeDerived(r)[c.key] : r[c.key];
      if(c.type==='pct' || c.type==='pctinput') v = Number(v)||0;
      rowData[c.key] = v;
    });
    ws.addRow(rowData);
  });
  styleSheet(ws, columns);
  return ws;
}
async function exportTable(tableKey){
  const cfg = tableRegistry[tableKey];
  const wb = new ExcelJS.Workbook();
  await addSheetForTable(wb, cfg.title.replace(/[^\w\sÀ-ÿ-]/g,'').trim(), cfg.columns, cfg.rows, cfg.computeDerived);
  const buf = await wb.xlsx.writeBuffer();
  downloadBuffer(buf, `${cfg.exportName}_${S().nome.replace(/\//g,'-')}.xlsx`);
}
async function exportSafraCompleta(){
  const s = S();
  const wb = new ExcelJS.Workbook();
  const colheitaCfg = buildColheitaCfg(s);
  const adtoCfg = buildAdiantamentosCfg(s);
  const vendaCfg = buildVendasCfg(s);
  await addSheetForTable(wb, 'Cadastros - Talhoes', [{key:'talhao',label:'Talhão'},{key:'area',label:'Área (ha)',type:'number'},{key:'variedade',label:'Variedade 1'},{key:'variedade2',label:'Variedade 2'}], s.talhoes, ()=>({}));
  await addSheetForTable(wb, 'Colheita', colheitaCfg.columns, colheitaCfg.rows, colheitaCfg.computeDerived);
  await addSheetForTable(wb, 'Adiantamento', adtoCfg.columns, adtoCfg.rows, adtoCfg.computeDerived);
  await addSheetForTable(wb, 'Silos e Vendas', vendaCfg.columns, vendaCfg.rows, vendaCfg.computeDerived);
  const buf = await wb.xlsx.writeBuffer();
  downloadBuffer(buf, `Custos_${s.cultura}_${s.nome.replace(/\//g,'-')}.xlsx`);
}
function downloadBuffer(buf, filename){
  const blob = new Blob([buf], {type:'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

      {key:'data', label:'Data', type:'date'},

      {key:'variedade', label:'Variedade', type:'select', dependsOn:'talhao', optionsFn:(row)=>{

        return variedadesDoTalhao(s, talhao);

columns: [

function pageColheita(){

// =================== PÁGINA: ADIANTAMENTOS ===================
function pageAdiantamentos(){
  const s = S();
  const cfg = buildAdiantamentosCfg(s);
  cfg.formHtml = renderAddForm(cfg);

  const resumo = s.motoristas.map(mot=>{
    const cargas = s.colheita.filter(c=>c.motorista===mot);
    const totalFrete = cargas.reduce((sum,c)=>sum+colheitaDerived(c).totalFrete,0);
    const adiantado = s.adiantamentos.filter(a=>a.motorista===mot).reduce((sum,a)=>sum+Number(a.valor||0),0);
    return {mot, cargas: cargas.length, totalFrete, adiantado, aPagar: totalFrete-adiantado};
  });
  const totFrete = resumo.reduce((sum,r)=>sum+r.totalFrete,0);
  const totAdto = resumo.reduce((sum,r)=>sum+r.adiantado,0);

  cfg.metricsHtml = `
    <div class="metrics">
      <div class="metric"><div class="val">${fmtR(totFrete)}</div><div class="lbl">Total de frete</div></div>
      <div class="metric"><div class="val">${fmtR(totAdto)}</div><div class="lbl">Total adiantado</div></div>
      <div class="metric"><div class="val text-red">${fmtR(totFrete-totAdto)}</div><div class="lbl">Saldo a pagar</div></div>
    </div>
    <div class="panel">
      <p class="section-title">Resumo por motorista</p>
      <div class="table-wrap"><table>
        <tr><th style="padding:8px 10px;">Motorista</th><th style="padding:8px 10px;">Cargas</th><th style="padding:8px 10px;">Total Frete</th><th style="padding:8px 10px;">Adiantado</th><th style="padding:8px 10px;">A Pagar</th></tr>
        ${resumo.map(r=>`<tr><td class="readonly">${esc(r.mot)}</td><td class="readonly">${r.cargas}</td><td class="readonly">${fmtR(r.totalFrete)}</td><td class="readonly">${fmtR(r.adiantado)}</td><td class="readonly text-red">${fmtR(r.aPagar)}</td></tr>`).join('')}
      </table></div>
    </div>
  `;

  return renderTablePage(cfg);
}

// =================== PÁGINA: SILOS E VENDAS ===================
function pageVendas(){
  const s = S();
  const cfg = buildVendasCfg(s);
  cfg.formHtml = renderAddForm(cfg);

  const estoque = s.locais.map(local=>{
    const cargasLocal = s.colheita.filter(c=>c.local===local);
    const sacasLiq = cargasLocal.reduce((sum,c)=>sum+colheitaDerived(c).sacasLiquidas,0);
    const vendidas = s.vendas.filter(v=>v.local===local).reduce((sum,v)=>sum+vendaDerived(v).sacasVendidas,0);
    const saldo = Math.round((sacasLiq-vendidas)*100)/100; return {local, cargas: cargasLocal.length, sacasLiq, vendidas, saldo: Math.abs(saldo)<0.01 ? 0 : saldo};
  });
  const totalVendido = s.vendas.reduce((sum,v)=>sum+vendaDerived(v).sacasVendidas,0);
  const faturamento = s.vendas.reduce((sum,v)=>sum+vendaDerived(v).totalVenda,0);
  const vlMedio = totalVendido ? faturamento/totalVendido : 0;
  const saldoEstoque = estoque.reduce((sum,e)=>sum+e.saldo,0);

  cfg.metricsHtml = `
    <div class="panel">
      <p class="section-title">Estoque por local de entrega</p>
      <div class="table-wrap"><table>
        <tr><th style="padding:8px 10px;">Local - Silo</th><th style="padding:8px 10px;">Cargas</th><th style="padding:8px 10px;">Sacas (60kg)</th><th style="padding:8px 10px;">Sacas Vendidas</th><th style="padding:8px 10px;">Saldo a Vender</th></tr>
        ${estoque.map(e=>`<tr><td class="readonly">${esc(e.local)}</td><td class="readonly">${e.cargas}</td><td class="readonly">${fmt(e.sacasLiq)}</td><td class="readonly">${fmt(e.vendidas)}</td><td class="readonly">${fmt(e.saldo)}</td></tr>`).join('')}
      </table></div>
    </div>
    <div class="metrics">
      <div class="metric"><div class="val">${fmt(totalVendido)}</div><div class="lbl">Total vendido (sc)</div></div>
      <div class="metric"><div class="val">${fmtR(faturamento)}</div><div class="lbl">Faturamento total</div></div>
      <div class="metric"><div class="val">${fmtR(vlMedio)}</div><div class="lbl">Vl médio/saca</div></div>
      <div class="metric"><div class="val">${fmt(saldoEstoque)}</div><div class="lbl">Saldo em estoque (sc)</div></div>
    </div>
  `;

  return renderTablePage(cfg);
}

        <form id="form-mot" style="margin-top:12px; display:flex; gap:8px;" class="no-print">

// =================== PÁGINA: CADASTRO DE SAFRA ===================
function pageSafras(){
  const cards = Object.entries(state.safras).map(([key,s])=>{
    const areaTotal = s.talhoes.reduce((sum,t)=>sum+Number(t.area||0),0);
    return `
      <div class="safra-card ${key===state.safraAtual?'active':''}">
        <div>
          <h3>${esc(s.nome)} <span class="badge">${esc(s.cultura)}</span></h3>
          <p>${esc(s.propriedade)} · ${fmt(areaTotal)} ha cadastrados · ${s.colheita.length} lançamentos de colheita</p>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="secondary" onclick="usarSafra('${key}')">Usar esta safra</button>
          ${Object.keys(state.safras).length>1 ? `<button class="ghost" onclick="removerSafra('${key}')">Excluir</button>` : ''}
        </div>
      </div>`;
  }).join('');

  return `
    <h2>🌾 Cadastro de Safra</h2>
    <div class="caption">Ao criar uma nova safra, os talhões, locais de entrega e motoristas são copiados da safra atual (variedade e "Será Plantado?" ficam em branco/desmarcado pra você escolher de novo). Colheita, adiantamentos e vendas começam zerados.</div>
    ${cards}
    <div class="panel" style="margin-top:20px;">
      <p class="section-title">Nova safra</p>
      <div class="grid cols-2">
        <div><label>Nome da safra</label><input type="text" id="nova-safra-nome" placeholder="Ex: Soja 2026/2027"></div>
        <div><label>Cultura</label>
          <select id="nova-safra-cultura">
            <option>Soja</option><option>Milho</option><option>Sorgo</option><option>Algodão</option><option>Outra</option>
          </select>
        </div>
      </div>
      <div style="margin-top:14px;">
        <label>Propriedade</label><input type="text" id="nova-safra-propriedade" value="${esc(S().propriedade)}">
      </div>
      <button class="primary" style="margin-top:14px;" onclick="criarNovaSafra()" type="button">Criar safra</button>
    </div>
  `;
}
function usarSafra(key){ state.safraAtual = key; setPage('dashboard'); }
function removerSafra(key){
  recordUndo();
  delete state.safras[key];
  if(state.safraAtual===key) state.safraAtual = Object.keys(state.safras)[0];
  render();
}
function criarNovaSafra(){
  const nome = document.getElementById('nova-safra-nome').value.trim();
  if(!nome){ alert('Dá um nome pra safra antes de criar.'); return; }
  const cultura = document.getElementById('nova-safra-cultura').value;
  const propriedade = document.getElementById('nova-safra-propriedade').value.trim() || S().propriedade;
  const atual = S();
  const key = 'safra_' + Date.now();
  recordUndo();
  state.safras[key] = {
    nome, cultura, produtor: PRODUTOR_FIXO, propriedade,
    talhoes: JSON.parse(JSON.stringify(atual.talhoes)).map(t=>({...t, variedade:'', variedade2:'', plantado:false})),
    locais: [...atual.locais],
    motoristas: [...atual.motoristas],
    colheita: [], adiantamentos: [], vendas: [],
  };
  state.safraAtual = key;
  setPage('cadastros');
}

// =================== NAVEGAÇÃO ESTILO EXCEL ===================
let pendingCellFocus = null;
function focusTableCell(tableKey, rowIdx, field){
  const tbody = document.getElementById('tbody-'+tableKey);
  if(!tbody) return false;
  const el = tbody.querySelector(`[data-idx="${rowIdx}"][data-field="${field}"]`);
  if(!el) return false;
  el.focus();
  if(el.tagName==='INPUT' && el.type==='text') el.select();
  return true;
}
function bindExcelEnterNavigation(){
  Object.keys(tableRegistry).forEach(tableKey=>{
    const tbody = document.getElementById('tbody-'+tableKey);
    if(!tbody || tbody.dataset.excelEnterBound==='1') return;
    tbody.dataset.excelEnterBound='1';
    tbody.addEventListener('keydown', e=>{
      if(e.key!=='Enter' || e.altKey || e.ctrlKey || e.metaKey) return;
      const el = e.target.closest('input,select');
      if(!el || !el.dataset.field) return;
      e.preventDefault();
      const field = el.dataset.field;
      const rowIdx = Number(el.dataset.idx);
      const targetIdx = e.shiftKey ? rowIdx-1 : rowIdx+1;
      if(targetIdx>=0 && targetIdx<tableRowsVisible[tableKey].length){
        focusTableCell(tableKey,targetIdx,field);
        return;
      }
      // No último registro, Enter cria uma nova linha e continua na mesma coluna.
      if(!e.shiftKey){
        const cfg = tableRegistry[tableKey];
        if(cfg && typeof cfg.newRow==='function'){
          pendingCellFocus = {tableKey, field, rowIdx: tableRowsVisible[tableKey].length};
          recordUndo();
          cfg.rows.push(cfg.newRow());
          render();
          requestAnimationFrame(()=>{
            if(pendingCellFocus){
              focusTableCell(pendingCellFocus.tableKey,pendingCellFocus.rowIdx,pendingCellFocus.field);
              pendingCellFocus=null;
            }
          });
        }
      }
    });
  });
}

// =================== EVENTOS ESTÁTICOS ===================
function bindStaticEvents(){
  Object.keys(tableRegistry).forEach(k=>{ if(document.getElementById('tbody-'+k)) renderTbody(k); });

  const fLocal = document.getElementById('form-local');
  if(fLocal) fLocal.addEventListener('submit', e=>{ e.preventDefault(); recordUndo(); const f=new FormData(fLocal); S().locais.push(f.get('local')); render(); });

  const fMot = document.getElementById('form-mot');
  if(fMot) fMot.addEventListener('submit', e=>{ e.preventDefault(); recordUndo(); const f=new FormData(fMot); S().motoristas.push(f.get('mot')); render(); });

  // Campos dependentes no formulário de adicionar registro (ex.: Variedade depende do Talhão)
  Object.values(tableRegistry).forEach(cfg=>{
    const wrap = document.getElementById('addform-'+cfg.tableKey);
    if(!wrap) return;
    cfg.columns.forEach(sourceCol=>{
      const sourceEl = wrap.querySelector(`[name="${sourceCol.key}"]`);
      if(!sourceEl) return;
      sourceEl.addEventListener('change', ()=>{
        cfg.columns.forEach(depCol=>{
          if(depCol.type!=='select' || depCol.dependsOn!==sourceCol.key) return;
          const targetEl = wrap.querySelector(`[name="${depCol.key}"]`);
          if(!targetEl) return;
          const draft = {};
          cfg.columns.filter(c=>!c.derived).forEach(c=>{
            const e = wrap.querySelector(`[name="${c.key}"]`);
            if(e) draft[c.key] = e.type==='checkbox' ? e.checked : e.value;
          });
          const options = depCol.optionsFn ? depCol.optionsFn(draft) : [];
          targetEl.innerHTML = `<option value="">—</option>` + options.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('');
          targetEl.value = options[0] || '';
        });
      });
    });
    // Garante que os dependentes já abram corretamente ao carregar o formulário.
    cfg.columns.forEach(sourceCol=>{
      const sourceEl = wrap.querySelector(`[name="${sourceCol.key}"]`);
      if(sourceEl && cfg.columns.some(c=>c.dependsOn===sourceCol.key)) sourceEl.dispatchEvent(new Event('change'));
    });
  });

  bindExcelEnterNavigation();
}

// =================== LOGIN FIREBASE ===================
function showAuthState(loggedIn){
  document.body.classList.remove('auth-pending','auth-logged-out','authenticated');
  document.body.classList.add(loggedIn ? 'authenticated' : 'auth-logged-out');
}
function authErrorMessage(err){
  const code = err && err.code || '';
  if(code.includes('invalid-credential') || code.includes('wrong-password') || code.includes('user-not-found')) return 'E-mail ou senha incorretos.';
  if(code.includes('too-many-requests')) return 'Muitas tentativas. Aguarde um pouco e tente novamente.';
  return 'Não foi possível entrar. Confira o e-mail e a senha.';
}
function initAuth(){
  if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});

  const form = document.getElementById('loginForm');
  const btn = document.getElementById('loginButton');
  const errEl = document.getElementById('loginError');
  form.addEventListener('submit', async e=>{
    e.preventDefault();
    errEl.textContent=''; btn.disabled=true; btn.textContent='Entrando...';
    try{
      await firebase.auth().signInWithEmailAndPassword(
        document.getElementById('loginEmail').value.trim(),
        document.getElementById('loginPassword').value
      );
    }catch(err){ errEl.textContent=authErrorMessage(err); }
    finally{ btn.disabled=false; btn.textContent='Entrar'; }
  });
  document.getElementById('logoutBtn').addEventListener('click', ()=>firebase.auth().signOut());

  firebase.auth().onAuthStateChanged(user=>{
    if(user){
      showAuthState(true);
      if(!firebaseReady) initFirebase();
      else render();
    }else{
      showAuthState(false);
      clearUndoHistory();
      firebaseReady=false;
      if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot=null; }
      db=null; docRef=null;
      setSyncStatus('⚪ Aguardando login', 'local');
    }
  });
}

if(FIREBASE_CONFIGURADO){
  initAuth();
} else {
  showAuthState(true);
  render();
}
</script>
